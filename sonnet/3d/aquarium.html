<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Aquarium</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #050d1a; }
        canvas { display: block; }
        #hint {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(130, 190, 255, 0.55);
            font: 13px/1 sans-serif;
            letter-spacing: 0.6px;
            pointer-events: none;
            user-select: none;
        }
    </style>
</head>
<body>
<div id="hint">Drag to rotate &nbsp;·&nbsp; Scroll to zoom &nbsp;·&nbsp; Right-drag to pan</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ───────────────────────────────────────────────────────────────────
   Renderer, scene, camera
─────────────────────────────────────────────────────────────────── */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060e1c);
// Subtle fog adds underwater depth without hiding the tank
scene.fog = new THREE.FogExp2(0x0a1828, 0.018);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 3.5, 18);

// Orbit controls: drag to rotate, scroll to zoom, right-drag to pan
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping  = true;
controls.dampingFactor  = 0.06;
controls.minDistance    = 3;
controls.maxDistance    = 30;

window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});

/* ───────────────────────────────────────────────────────────────────
   Lighting
─────────────────────────────────────────────────────────────────── */
// Soft blue-tinted ambient — simulates scattered underwater light
scene.add(new THREE.AmbientLight(0x1a3d5c, 1.4));

// Main sun ray through water surface
const sun = new THREE.DirectionalLight(0x5599ee, 1.6);
sun.position.set(3, 9, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 8, bottom: -8, near: 0.1, far: 30 });
scene.add(sun);

// Accent fill lights for depth and colour variation
const blueAccent = new THREE.PointLight(0x0044bb, 0.9, 24);
blueAccent.position.set(-5, 2, -3);
scene.add(blueAccent);

const tealAccent = new THREE.PointLight(0x00aa77, 0.55, 20);
tealAccent.position.set(4, -1, 3);
scene.add(tealAccent);

// Animated caustic simulation — point lights that drift and flicker
// to mimic sunlight refracting through rippling water
const caustics = Array.from({ length: 3 }, () => {
    const pl = new THREE.PointLight(0x3377ee, 0.35, 14);
    pl.position.set((Math.random() - 0.5) * 8, 2.8, (Math.random() - 0.5) * 5);
    scene.add(pl);
    return {
        pl,
        bx: pl.position.x,
        bz: pl.position.z,
        ph: Math.random() * Math.PI * 2,
        sp: 0.3 + Math.random() * 0.5,
    };
});

/* ───────────────────────────────────────────────────────────────────
   Aquarium tank  (TW × TH × TD world units)
─────────────────────────────────────────────────────────────────── */
const TW = 12, TH = 6, TD = 8;

// Visible frame edges
scene.add(Object.assign(
    new THREE.LineSegments(
        new THREE.EdgesGeometry(new THREE.BoxGeometry(TW, TH, TD)),
        new THREE.LineBasicMaterial({ color: 0x6699bb, transparent: true, opacity: 0.55 })
    )
));

// Glass panels — very subtle tint, high specular, back-face visible
const glassMat = new THREE.MeshPhongMaterial({
    color: 0x99ccff,
    shininess: 200,
    specular: 0xaaddff,
    transparent: true,
    opacity: 0.09,
    side: THREE.DoubleSide,
    depthWrite: false,
});
[
    [[TW, TH], [0,      0,    TD/2], [0,         0, 0]],   // front
    [[TW, TH], [0,      0,   -TD/2], [0,         0, 0]],   // back
    [[TD, TH], [-TW/2,  0,      0], [0,  Math.PI/2, 0]],   // left
    [[TD, TH], [ TW/2,  0,      0], [0,  Math.PI/2, 0]],   // right
    [[TW, TD], [0,   TH/2,      0], [Math.PI/2,  0, 0]],   // top
    [[TW, TD], [0,  -TH/2,      0], [Math.PI/2,  0, 0]],   // bottom
].forEach(([size, pos, rot]) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(...size), glassMat);
    m.position.set(...pos);
    m.rotation.set(...rot);
    scene.add(m);
});

// Water volume — rendered from inside (BackSide) for the tinted fill effect
scene.add(new THREE.Mesh(
    new THREE.BoxGeometry(TW - 0.06, TH - 0.06, TD - 0.06),
    new THREE.MeshPhongMaterial({
        color: 0x052a55,
        transparent: true,
        opacity: 0.4,
        side: THREE.BackSide,
        depthWrite: false,
    })
));

/* ───────────────────────────────────────────────────────────────────
   Substrate: sand floor + scattered rocks
─────────────────────────────────────────────────────────────────── */
const sandFloor = new THREE.Mesh(
    new THREE.BoxGeometry(TW - 0.08, 0.3, TD - 0.08),
    new THREE.MeshLambertMaterial({ color: 0xc8a575 })
);
sandFloor.position.y = -TH / 2 + 0.15;
sandFloor.receiveShadow = true;
scene.add(sandFloor);

const rockPalette = [0x6b6b73, 0x787860, 0x5a6264, 0x706858];
for (let i = 0; i < 14; i++) {
    const s = Math.random() * 0.28 + 0.08;
    const rock = new THREE.Mesh(
        new THREE.DodecahedronGeometry(s, 0),
        new THREE.MeshLambertMaterial({ color: rockPalette[i % 4] })
    );
    rock.position.set(
        (Math.random() - 0.5) * (TW - 1.5),
        -TH / 2 + 0.3 + s * 0.5,
        (Math.random() - 0.5) * (TD - 1.5)
    );
    rock.rotation.set(Math.random() * 6, Math.random() * 6, Math.random() * 6);
    rock.castShadow = true;
    scene.add(rock);
}

/* ───────────────────────────────────────────────────────────────────
   Seaweed — segmented cylinders stored for sway animation
─────────────────────────────────────────────────────────────────── */
const seaweedAnims = [];
for (let p = 0; p < 16; p++) {
    const bx = (Math.random() - 0.5) * (TW - 2);
    const bz = (Math.random() - 0.5) * (TD - 2);
    const segs = 3 + Math.floor(Math.random() * 4);
    const segH = (Math.random() * 1.3 + 0.5) / segs;
    const col  = new THREE.Color().setHSL(0.28 + Math.random() * 0.1, 0.78, 0.27 + Math.random() * 0.1);

    for (let s = 0; s < segs; s++) {
        const r1 = Math.max(0.055 - s * 0.008, 0.012);
        const r2 = Math.max(0.04  - s * 0.007, 0.008);
        const sw = new THREE.Mesh(
            new THREE.CylinderGeometry(r2, r1, segH, 5),
            new THREE.MeshLambertMaterial({ color: col })
        );
        sw.position.set(
            bx + (Math.random() - 0.5) * 0.09 * s,
            -TH / 2 + 0.3 + segH * (s + 0.5),
            bz + (Math.random() - 0.5) * 0.09 * s
        );
        sw.rotation.z = (Math.random() - 0.5) * 0.5;
        sw.castShadow = true;
        scene.add(sw);
        seaweedAnims.push({ mesh: sw, baseZ: sw.rotation.z, baseX: sw.rotation.x, ph: Math.random() * Math.PI * 2 });
    }
}

/* ───────────────────────────────────────────────────────────────────
   Bubbles — spheres that rise from the floor and reset
─────────────────────────────────────────────────────────────────── */
const bubbleMat = new THREE.MeshPhongMaterial({
    color: 0xaaddff,
    transparent: true,
    opacity: 0.32,
    shininess: 200,
    specular: 0xffffff,
    depthWrite: false,
});

const bubbleData = Array.from({ length: 55 }, () => {
    const r = 0.02 + Math.random() * 0.055;
    const m = new THREE.Mesh(new THREE.SphereGeometry(r, 6, 6), bubbleMat);
    // Scatter them randomly at start so they don't all appear at the bottom
    m.position.set(
        (Math.random() - 0.5) * (TW - 0.8),
        (Math.random() - 0.5) * TH,
        (Math.random() - 0.5) * (TD - 0.8)
    );
    scene.add(m);
    return { mesh: m, vy: 0.35 + Math.random() * 0.6, wobble: Math.random() * Math.PI * 2 };
});

function resetBubble(b) {
    b.mesh.position.set(
        (Math.random() - 0.5) * (TW - 0.8),
        -TH / 2 + 0.4,
        (Math.random() - 0.5) * (TD - 0.8)
    );
}

/* ───────────────────────────────────────────────────────────────────
   Fish construction — body, tail, fins, eye, highlight
─────────────────────────────────────────────────────────────────── */
function buildFish(color, scale) {
    const g   = new THREE.Group();
    const body = new THREE.MeshPhongMaterial({ color, shininess: 110 });
    const fin  = new THREE.MeshPhongMaterial({ color, transparent: true, opacity: 0.72, side: THREE.DoubleSide });

    // ── Body: flattened sphere scaled along X
    const bm = new THREE.Mesh(new THREE.SphereGeometry(0.35, 14, 10), body);
    bm.scale.set(1.1, 0.62, 0.55);
    g.add(bm);                              // children[0]

    // ── Tail fin: cone with tip toward body, base extending backward
    //    ConeGeometry tip = +X after rotation.z = -PI/2
    const tm = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.44, 4, 1), fin);
    tm.rotation.z = -Math.PI / 2;
    tm.position.x = -0.52;
    g.add(tm);                              // children[1]  ← animated

    // ── Dorsal fin
    const dm = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.2, 3, 1), fin);
    dm.position.set(-0.06, 0.31, 0);
    g.add(dm);                              // children[2]

    // ── Pectoral fin (side)
    const pm = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.19, 3, 1), fin);
    pm.rotation.set(0, 0, Math.PI / 2);
    pm.position.set(0.04, -0.04, 0.2);
    g.add(pm);

    // ── Eye
    const em = new THREE.Mesh(new THREE.SphereGeometry(0.065, 8, 8),
        new THREE.MeshPhongMaterial({ color: 0x111111, shininess: 300, specular: 0xffffff }));
    em.position.set(0.27, 0.09, 0.19);
    g.add(em);

    // ── Specular highlight on eye
    const hl = new THREE.Mesh(new THREE.SphereGeometry(0.022, 5, 5),
        new THREE.MeshBasicMaterial({ color: 0xffffff }));
    hl.position.set(0.29, 0.115, 0.23);
    g.add(hl);

    g.scale.setScalar(scale);
    return g;
}

const PALETTE = [
    0xff5522, 0xffaa00, 0xff2299, 0x33ffcc,
    0xffff33, 0x55aaff, 0xff7733, 0x44ffbb, 0xdd44ff,
];

// Half-extents for fish swim bounds (inset from tank walls)
const HW = TW / 2 - 0.7;
const HH = TH / 2 - 0.7;
const HD = TD / 2 - 0.7;

// Reusable vectors to avoid per-frame allocations
const _v0   = new THREE.Vector3();
const _v1   = new THREE.Vector3();
const _q0   = new THREE.Quaternion();
const _xDir = new THREE.Vector3(1, 0, 0);   // fish model faces +X

/* ───────────────────────────────────────────────────────────────────
   Fish instances with AI state
─────────────────────────────────────────────────────────────────── */
function pickTarget(fd) {
    fd.target.set(
        (Math.random() - 0.5) * (TW - 1.5),
        (Math.random() - 0.5) * (TH - 1.5),
        (Math.random() - 0.5) * (TD - 1.5)
    );
}

const fishData = Array.from({ length: 9 }, (_, i) => {
    const sc   = 0.65 + Math.random() * 0.55;
    const mesh = buildFish(PALETTE[i % PALETTE.length], sc);
    mesh.position.set(
        (Math.random() - 0.5) * (TW - 2),
        (Math.random() - 0.5) * (TH - 1.5),
        (Math.random() - 0.5) * (TD - 2)
    );
    scene.add(mesh);

    const fd = {
        mesh,
        vel:    new THREE.Vector3((Math.random()-0.5)*0.05, (Math.random()-0.5)*0.02, (Math.random()-0.5)*0.05),
        target: new THREE.Vector3(),
        speed:  1.2 + Math.random() * 1.4,     // units / second
        turn:   0.6 + Math.random() * 0.9,     // steering strength
        wp:     Math.random() * Math.PI * 2,   // wiggle phase
        ws:     2   + Math.random() * 2,        // wiggle speed (rad/s)
        wa:     0.14 + Math.random() * 0.08,   // wiggle amplitude
    };
    pickTarget(fd);
    return fd;
});

/* ───────────────────────────────────────────────────────────────────
   Animation loop
─────────────────────────────────────────────────────────────────── */
const clock = new THREE.Clock();

(function animate() {
    requestAnimationFrame(animate);

    // Cap dt to avoid huge jumps if tab was backgrounded
    const dt = Math.min(clock.getDelta(), 0.05);
    const t  = clock.elapsedTime;

    /* -- Caustic lights drift and flicker -------------------------------- */
    for (const c of caustics) {
        c.pl.position.x = c.bx + Math.sin(t * c.sp + c.ph) * 1.6;
        c.pl.position.z = c.bz + Math.cos(t * c.sp * 0.7 + c.ph) * 1.1;
        c.pl.intensity  = 0.28 + Math.abs(Math.sin(t * 1.4 + c.ph)) * 0.2;
    }

    /* -- Seaweed gentle sway --------------------------------------------- */
    for (const s of seaweedAnims) {
        s.mesh.rotation.z = s.baseZ + Math.sin(t * 0.85 + s.ph) * 0.14;
        s.mesh.rotation.x = s.baseX + Math.sin(t * 0.6  + s.ph + 1.2) * 0.07;
    }

    /* -- Bubbles rise, wobble sideways, reset at surface ----------------- */
    for (const b of bubbleData) {
        b.wobble += dt * 1.1;
        b.mesh.position.y += b.vy * dt;
        b.mesh.position.x += Math.sin(b.wobble) * 0.007;
        if (b.mesh.position.y > TH / 2 - 0.1) resetBubble(b);
    }

    /* -- Fish AI: seek target, smooth turning, wall bounce, wiggle ------- */
    for (const fd of fishData) {
        const p = fd.mesh.position;
        const v = fd.vel;

        // Direction and distance to current target
        _v0.subVectors(fd.target, p);
        if (_v0.length() < 0.6) pickTarget(fd);   // close enough → new target

        // Desired velocity = direction to target at max speed
        _v1.copy(_v0).normalize().multiplyScalar(fd.speed);

        // Steering = (desired − current) * turnRate — produces smooth arcing turns
        _v0.subVectors(_v1, v).multiplyScalar(fd.turn * dt);
        v.add(_v0);

        // Clamp to max speed
        const spd = v.length();
        if (spd > fd.speed) v.multiplyScalar(fd.speed / spd);

        // Translate
        p.addScaledVector(v, dt);

        // Bounce off tank walls — flip the relevant velocity component
        if (p.x >  HW) { v.x = -Math.abs(v.x); p.x =  HW; }
        if (p.x < -HW) { v.x =  Math.abs(v.x); p.x = -HW; }
        if (p.y >  HH) { v.y = -Math.abs(v.y); p.y =  HH; }
        if (p.y < -HH) { v.y =  Math.abs(v.y); p.y = -HH; }
        if (p.z >  HD) { v.z = -Math.abs(v.z); p.z =  HD; }
        if (p.z < -HD) { v.z =  Math.abs(v.z); p.z = -HD; }

        // Smoothly rotate fish to face its velocity direction
        if (v.lengthSq() > 1e-4) {
            _q0.setFromUnitVectors(_xDir, _v1.copy(v).normalize());
            fd.mesh.quaternion.slerp(_q0, 0.08);
        }

        // Tail flap (children[1]) and subtle body sway (children[0])
        fd.wp += fd.ws * dt;
        fd.mesh.children[1].rotation.y = Math.sin(fd.wp) * fd.wa * 2.2;
        fd.mesh.children[0].rotation.y = Math.sin(fd.wp) * fd.wa * 0.35;
    }

    controls.update();
    renderer.render(scene, camera);
}());
</script>
</body>
</html>
